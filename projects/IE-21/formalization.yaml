fidelity:
  divergences: The real m-by-n matrix has independent rows uniform on the unit sphere; every sequence
    with n tending to infinity and m/n tending to infinity is permitted. For fixed theta between zero
    and one, retain floor(theta*m) rows and minimize the variational least singular value over all such
    subsets. The limiting h_theta is E[G^2 1_{|G|<=a_theta}] for a standard Gaussian G and its unique
    symmetric theta-quantile a_theta. No stronger growth condition on the aspect ratio and no fixed common
    probability space are assumed. The deterministic optimality result is the separate IE-22 component. This
    entry passed ordinary full-source Lean 4.35.0 compilation and read-only compiled axiom-dependency
    queries for every configured declaration, within propext, Classical.choice and Quot.sound. Historical
    Lean 4.33.1 receipts remain separate source-bound evidence. Official Comparator and NanoDa verification
    remain pending the authors' later submission; no Palomar acceptance or independent-kernel replay is
    claimed.
