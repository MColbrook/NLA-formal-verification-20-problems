    module: Challenge
    status: ordinary source build and compiled axiom-dependency query passed; official comparison pending
    note: For every positive word length n and joint spectral radius rho>0, the maximal product norm is
      at most theta_d*(L*n)^(d-1)*rho^(n-d+1), where L>0 bounds all generator norms, theta_1=1 and theta_d=d*(2*exp(1)*d^2/(d-1))^(d-1)
      for d>=2.
  - source: mfu-thm-growth
    lean: NLA.MF05.Paper.paper_real_bounded_zero_radius_nilpotent
    module: Challenge
    status: ordinary source build and compiled axiom-dependency query passed; official comparison pending
    note: If the joint spectral radius is zero, every matrix word of length at least the ambient dimension
      is exactly zero.
  - source: mfu-thm-holder
    lean: NLA.MF05.Paper.paper_real_uniform_holder
    module: Challenge
    status: ordinary source build and compiled axiom-dependency query passed; official comparison pending
    note: For two nonempty compact real matrix families in a common norm ball, bounds the difference of
      their joint spectral radii by d(2d+1)L^(1-1/d) times their spectral Hausdorff distance to power
      1/d.
