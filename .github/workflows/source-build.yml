name: Source build and submission preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/check_submission.py --self-test
      - run: python scripts/build_entry_metadata.py --check
      - run: python scripts/build_combined_interface.py --check
      - run: python scripts/build_combined_project.py --check
      - run: python tools/check_source_coverage.py
      - run: python tools/check_submission.py --static-only
  compile:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ["MF-05", "MF-12", "RA-02", "RA-08", "RA-09", "IE-21", "IE-22", "TR-04", "TR-27", "IS-03", "NM-04", "PF-02", "MD-06", "IV-04", "MI-19", "MI-21", "MI-22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned compiler
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare public dependencies
        run: python scripts/prepare_dependencies.py
      - name: Start a separate build receipt
        run: python -c "from pathlib import Path; Path('verification/build-status.json').unlink(missing_ok=True)"
      - name: Compile Solution and Challenge
        shell: bash
        run: python scripts/build_project.py ${{ matrix.project }} --lean "$(elan which lean)" --memory-mb 4096
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-build-${{ matrix.project }}
          path: verification/
          retention-days: 14
  evidence:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: source-build-*
          path: source-build-receipts
      - run: python -m pip install -r tools/requirements.txt
      - run: python scripts/merge_build_receipts.py source-build-receipts
      - name: Install the pinned compiler for the combined interface
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare combined dependencies
        run: python scripts/prepare_dependencies.py
      - name: Compile the single submitted environment and query its axioms
        shell: bash
        run: python scripts/build_combined_project.py --lean "$(elan which lean)" --jobs 4 --memory-mb 4096
      - name: Compare the selected types and fixed definition bodies
        shell: bash
        run: python scripts/check_combined_correspondence.py --lean "$(elan which lean)"
      - run: python tools/check_submission.py --json audit/static-submission-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: complete-source-build-report
          path: |
            verification/build-status.json
            verification/combined-build-status.json
            verification/combined-correspondence.json
            verification/correspondence/
            verification/selected-axioms/NLA20/
            audit/static-submission-check.json
