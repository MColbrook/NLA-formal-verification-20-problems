status:
  scope: >-
    One repository-root Palomar entry covers all twenty headline problem
    resolutions and all 34 component headline and supporting declarations,
    together with explicitly documented auxiliary proof targets required for
    exact comparison of the fixed mathematical definitions.
    Seventeen component proof projects retain the original mathematical
    accounts, auxiliary proofs, provenance, and independent compilation
    receipts. Historical source coverage records 53 named statements and
    57 prose claim groups for the identified manuscript. Alternative
    auxiliary tensor and interval environments remain independent component
    compilation roots; the combined Solution imports the primary proof
    environments needed for the selected statements. Its fresh compilation
    and axiom evidence are recorded in verification/combined-build-status.json.
    Component receipts alone do not establish the combined interface.
    Official Palomar and independent NanoDa verification remain pending.
  axioms: [propext, Classical.choice, Quot.sound]

# This repository contains the substantive development. No thin-wrapper
# repository.substantive_formalization declaration applies.
automation:
  methods:
    - method: agent
      models: []
      framework: "OpenAI Codex"
      tool_setup: >-
        Substantial AI assistance in proof implementation, source-to-statement
        correspondence audits, independent agent reviews, packaging and
        module-system migration. Historical proofs used Lean 4.33.1, Mathlib
        and LeanCert; their archived provenance is retained. The new Lean
        4.35.0 port uses canonical Mathlib and its pinned dependencies without
        LeanCert. Seven numerical certificate statements are unchanged while
        their proofs are ported to Mathlib norm_num arithmetic and explicit
        exponential bounds. The seventh is MI-19 strict_scalar_gap, formerly
        proved with LeanCert kernel trust and now with norm_num. The port
        also includes explicitly logged probability-map, finite-PMF,
        visibility and other API compatibility proof edits, preserving all
        mathematical statements. Ordinary full-source compilation and compiled
        selected-axiom queries passed for this port. Exact historical model
        identifiers were not consistently recorded and are
        not reconstructed.
      cost:
        wall_time: "not tracked as a complete aggregate"
        spend_usd: "not tracked"
        hardware: >-
          Local workstations and approved remote Linux verification;
          complete aggregate hardware accounting was not recorded.
      prompting_notes: >-
        Develop and audit the mathematical statements separately from proofs,
        retain Challenge/Solution boundaries and original attribution, check
        source correspondence, and reject proof dependencies beyond the three
        permitted foundational axioms. Initial packaging was authorized without
        a new kernel replay, GitHub upload or Palomar submission. GitHub
        publication was subsequently authorized on 20 November 2026; Palomar
        submission remains a separate step.
  spend_usd: "not tracked"
  notes: >-
    Human authors retain responsibility for the content. AI systems are
    credited here, not listed as human authors or responsible maintainers.
    The source manuscript itself contains an AI declaration. Distinct agent
    roles and their limits are preserved in dated evidence records; no
    independent human refereeing or upstream author endorsement is inferred.

fidelity:
  divergences: >-
    The mathematical claims and their assumptions follow the recorded
    manuscript snapshot; numerical certificates, exact arithmetic/SVD cost
    models, finite-input complexity conventions, and external background
    attributions have explicit scope in the coverage ledgers. The repository
    contains the compatibility and interface changes required by the current
    Palomar contract. Ordinary full-source compilation and compiled
    selected-axiom queries passed on the new source snapshot; official
    comparison and NanoDa verification remain pending. Historical receipt
    acceptance is not used to certify the port. No bit-complexity or finite-precision guarantee is asserted for the
    tensor-train exact arithmetic/SVD model.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex agents; dated source and correspondence review records"
  notes: >-
    Historical mathematical correspondence and proof-scope reviews were AI
    reviews. The prior unchanged package audit reported complete coverage;
    five repaired interfaces had accepted component replays. The earlier
    combined replay accepted a previous 333-interface source selection.
    A fresh combined replay of the later 338-interface selection was cancelled
    by the user before launch and remains cancelled. The new Lean 4.35.0
    snapshot separately passed ordinary full-source compilation and
    read-only compiled selected-axiom queries. These are mechanical checks,
    not independent human review, Comparator or NanoDa verification, official
    Palomar review or registry acceptance.
    The single-entry interface has separate source-bound records in
    verification/combined-build-status.json and
    verification/combined-correspondence.json. The latter invokes the bundled
    Comparator comparison core on compiled statement and ordinary-definition
    closures, without full proof export or kernel replay. These local checks remain
    distinct from official Palomar and NanoDa verification.
    The combined Challenge resets only the nonpersistent compiler auxiliary-lemma
    and matcher caches between original source units, preserving original
    generated proof and matcher references when those units are combined. The operation changes only cache
    state and introduces no mathematical assumptions or axioms; all material
    definition bodies remain subject to comparison.

