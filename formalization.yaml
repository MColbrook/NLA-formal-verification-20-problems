version: "v0.4"
project:
  name: "Numerical Linear Algebra, Explained: Twenty Problem Resolutions"
  description: >-
    Lean formalizations accompanying twenty numerical linear algebra problem
    resolutions. They give uniform matrix-product growth and local
    1/d-Hölder continuity of the joint spectral radius; two real generators
    with any prescribed nonnegative polynomial growth exponent; and sharp
    losses 2^r and 4^r for randomly pivoted Cholesky and LU. They show that
    concave matrix functions can destroy spectral approximation guarantees
    and amplify nuclear-norm excess without bound, and give sharp Frobenius
    transfer bounds with and without semidefinite order. Further results are
    the random-row adversarial deletion limit and sharp universal deletion
    constant, a pointwise strict tensor-train bound with unchanged worst-case
    supremum, and curves with rank savings delayed through any prescribed
    finite range of tensor powers. Counterexamples concern derivative roots
    of nonnegative characteristic polynomials, a q-permanent subset inequality,
    a geometric-mean norm inequality, and weighted log-majorisation. The
    development also proves the rectangular Rowland-Wu Sinkhorn identity,
    disconnected quotients of minimal positive semidefinite factors, stable
    nonsynchronised equilibria on random cubic graphs with high probability,
    and NP-hardness of exact determinant ranges and solution hulls for regular
    tridiagonal interval matrices. This repository prepares the proofs for
    Palomar through a single repository-root Challenge/Solution interface
    selecting all twenty problem resolutions. Seventeen component environments
    have recorded Lean 4.35.0 compilation and selected-axiom checks; the combined
    environment has separate current evidence. Official Palomar and independent
    NanoDa verification remain pending submission.
  authors:
    - "Matthew J. Colbrook"
    - "George Stepaniants"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Matthew J. Colbrook"
    - "George Stepaniants"

